services:
  - type: worker
    name: lhm-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements_enhanced.txt
    startCommand: python deepseek_python_20260707_a6bd19.py --dry-run
    envVars:
      - key: LHM_TELEGRAM_TOKEN
        sync: false
      - key: LHM_TELEGRAM_CHAT_ID
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: USE_FREE_SCRAPERS
        value: "true"
    autoDeploy: true
    healthCheckPath: /health
